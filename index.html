<!doctype html>
<html lang="es" data-theme="dia">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mar Agramonte | Desarrolladora Backend · Java, Python y SQL</title>
    <meta
      name="description"
      content="Portfolio de Mar Agramonte, desarrolladora Backend graduada en DAM. Java, Python, SQL y Docker. Palma de Mallorca, disponible para incorporación inmediata."
    />
    <meta name="author" content="Mar Agramonte" />
    <link rel="canonical" href="https://maragramonte.github.io/mi-portfolio/" />

    <!--
      Versión en inglés: en/index.html. Existe porque los bots que generan la
      previsualización al compartir el enlace (LinkedIn, WhatsApp) no ejecutan
      JavaScript, así que leen estas etiquetas tal cual y el botón de idioma no
      les cambia nada. Para compartir el portfolio en inglés se usa /en/.
    -->
    <link rel="alternate" hreflang="es" href="https://maragramonte.github.io/mi-portfolio/" />
    <link rel="alternate" hreflang="en" href="https://maragramonte.github.io/mi-portfolio/en/" />
    <link rel="alternate" hreflang="x-default" href="https://maragramonte.github.io/mi-portfolio/" />

    <!-- Iconos: SVG para navegadores modernos, PNG como alternativa -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Tarjeta de previsualización al compartir el enlace (LinkedIn, WhatsApp...) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Mar Agramonte" />
    <meta property="og:title" content="Mar Agramonte | Desarrolladora Backend · Java, Python y SQL" />
    <!-- Al menos 100 caracteres: por debajo de ahí LinkedIn avisa y a veces no
         pinta el texto bajo el título al compartir el enlace. -->
    <meta
      property="og:description"
      content="Proyectos de backend en Java, Spring Boot y PostgreSQL, con Docker y CI/CD. Graduada en DAM, en Palma de Mallorca y disponible para incorporación inmediata."
    />
    <meta property="og:url" content="https://maragramonte.github.io/mi-portfolio/" />
    <meta property="og:image" content="https://maragramonte.github.io/mi-portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mar Agramonte, desarrolladora Backend graduada en DAM" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#ff7043" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Aplica el tema y el idioma guardados ANTES de pintar la página.
      Sin esto, quien tenga elegido el tema "noche" ve un fogonazo blanco en cada visita.
    -->
    <script>
      (function () {
        /* Esta lista debe ir a la par con TEMAS en src/App.jsx. */
        var TEMAS = ['dia', 'amanecer', 'atardecer', 'noche']
        try {
          var tema = localStorage.getItem('tema')
          if (TEMAS.indexOf(tema) !== -1) document.documentElement.dataset.theme = tema
          /* En las páginas que fijan idioma (en/index.html) manda el de la
             página, no el guardado: quien abre el enlace en inglés espera
             inglés aunque su última visita fuera en español. */
          if (!document.documentElement.dataset.idiomaFijo) {
            var idioma = localStorage.getItem('idioma')
            if (idioma === 'es' || idioma === 'en') document.documentElement.lang = idioma
          }
        } catch (e) {
          /* localStorage bloqueado (modo incógnito): se queda el tema por defecto */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
