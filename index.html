<!doctype html>
<html lang="es" data-theme="noche">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mar Agramonte | Desarrolladora Backend y QA Automation · Java y Python</title>
    <meta
      name="description"
      content="Mar Agramonte, desarrolladora backend y QA Automation titulada en DAM. Java, Spring Boot, PostgreSQL y pruebas con JUnit y Python. Palma, incorporación inmediata."

    <link rel="canonical" href="https://maragramonte.com/" />

    <!--
      Versión en inglés: en/index.html. Existe porque los bots que generan la
      previsualización al compartir el enlace (LinkedIn, WhatsApp) no ejecutan
      JavaScript, así que leen estas etiquetas tal cual y el botón de idioma no
      les cambia nada. Para compartir el portfolio en inglés se usa /en/.
    -->
    <link rel="alternate" hreflang="es" href="https://maragramonte.com/" />
    <link rel="alternate" hreflang="en" href="https://maragramonte.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://maragramonte.com/" />

    <!-- Iconos: SVG para navegadores modernos, PNG como alternativa -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Tarjeta de previsualización al compartir el enlace (LinkedIn, WhatsApp...) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Mar Agramonte" />
    <meta property="og:title" content="Mar Agramonte | Desarrolladora Backend y QA Automation · Java y Python" />
    <!-- Al menos 100 caracteres: por debajo de ahí LinkedIn avisa y a veces no
         pinta el texto bajo el título al compartir el enlace. -->
    <meta
      property="og:description"
      content="Proyectos en Java, Spring Boot y PostgreSQL, cada uno con sus pruebas automatizadas y su CI. Titulada en DAM, en Palma de Mallorca y con incorporación inmediata."
    />
    <meta property="og:url" content="https://maragramonte.com/" />
    <meta property="og:image" content="https://maragramonte.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mar Agramonte, desarrolladora Backend graduada en DAM" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0a0e1f" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"

    />
