# Pull requests de actualización de dependencias y de las Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Las actualizaciones menores de desarrollo van juntas en un solo PR.
    groups:
      desarrollo:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
