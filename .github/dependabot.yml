# Pull requests de actualización de dependencias y de las Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Las mayores (React 19, Vite 8) cambian la API y rompen las E2E: se hacen a mano.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # React y React DOM tienen que ir siempre a la misma versión.
      react:
        patterns: ["react", "react-dom"]
      # Las menores de desarrollo van juntas en un solo PR.
      desarrollo:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
