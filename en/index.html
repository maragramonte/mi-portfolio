<!doctype html>
<!--
  Versión en inglés del portfolio. Carga exactamente la misma aplicación que
  index.html; lo único que cambia son las etiquetas de esta cabecera.

  Por qué existe este fichero: los bots que generan la previsualización al
  compartir un enlace (LinkedIn, WhatsApp, Twitter) y los buscadores no
  ejecutan JavaScript. Leen el HTML tal cual, así que el botón de idioma de la
  web no les cambia nada y el enlace salía siempre con el título en español.
  Para compartir el portfolio en inglés se usa esta dirección: /en/

  Al tocar las etiquetas de index.html hay que mirar si procede tocarlas aquí.
  data-idioma-fijo es lo que hace que la app arranque en inglés pase lo que pase
  (ver el useState de idioma en src/App.jsx).
-->
<html lang="en" data-theme="noche" data-idioma-fijo="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mar Agramonte | Backend Developer &amp; QA Automation · Java and Python</title>
    <meta
      name="description"
      content="Mar Agramonte, backend and QA Automation developer with a DAM degree. Java, Spring Boot, PostgreSQL, and testing with JUnit and Python. Palma, Spain, available now."
    />
    <meta name="author" content="Mar Agramonte" />
    <link rel="canonical" href="https://maragramonte.com/en/" />

    <link rel="alternate" hreflang="es" href="https://maragramonte.com/" />
    <link rel="alternate" hreflang="en" href="https://maragramonte.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://maragramonte.com/" />

    <!-- Iconos: SVG para navegadores modernos, PNG como alternativa -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Tarjeta de previsualización al compartir el enlace (LinkedIn, WhatsApp...) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Mar Agramonte" />
    <meta property="og:title" content="Mar Agramonte | Backend Developer &amp; QA Automation · Java and Python" />
    <!-- Al menos 100 caracteres: por debajo de ahí LinkedIn avisa y a veces no
         pinta el texto bajo el título al compartir el enlace. -->
    <meta
      property="og:description"
      content="Java, Spring Boot and PostgreSQL projects, each with its own automated tests and CI. DAM graduate based in Palma de Mallorca, available to start immediately."
    />
    <meta property="og:url" content="https://maragramonte.com/en/" />
    <meta property="og:image" content="https://maragramonte.com/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mar Agramonte, Backend Developer and Software Development graduate" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0a0e1f" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tema e idioma antes de pintar: vite.config.js pone aquí src/tema-inicial.js -->
    <!-- tema-inicial -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
